<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secciones y categorías · Panel admin</title>
<style>
  :root{ --bg:#f6f2ea; --panel:#fff; --ink:#241c17; --muted:#6b5d4f; --line:#e4dccc;
    --accent:#a5232f; --accent2:#7a1f27; --ok:#3d7a3d; --field:#fbf7ee;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.4}
  header{background:linear-gradient(90deg,var(--accent2),var(--accent));color:#fff;padding:14px 18px;
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  header h1{font-size:1.1rem;margin:0}
  header .sub{opacity:.85;font-size:.8rem}
  .wrap{max-width:820px;margin:0 auto;padding:18px 14px 80px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  button{font-family:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--accent);
    background:var(--accent);color:#fff;font-weight:700;font-size:.85rem;padding:8px 12px}
  button.ghost{background:transparent;color:var(--accent)}
  button.mini{padding:3px 8px;font-size:.75rem;border-radius:6px}
  button.gris{background:transparent;color:var(--muted);border-color:var(--line)}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .sec>.h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fbf7ee}
  .sec .nm{font-weight:800;font-size:1rem}
  .sec .id{color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums}
  .chip{font-size:.68rem;font-weight:700;border-radius:999px;padding:2px 8px;border:1px solid var(--line)}
  .chip.on{background:#e7f1e3;color:var(--ok);border-color:var(--ok)}
  .chip.off{background:#f6ddd9;color:var(--accent);border-color:var(--accent)}
  .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .cats{padding:6px 14px 12px}
  .cat{border-top:1px dashed var(--line);padding:9px 0}
  .cat .r{display:flex;align-items:center;gap:8px}
  .cat .cn{font-weight:700}
  .tipos{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0 0 14px}
  .tp{display:inline-flex;align-items:center;gap:5px;background:var(--field);border:1px solid var(--line);
    border-radius:999px;padding:3px 6px 3px 10px;font-size:.8rem}
  .tp button{background:none;border:none;color:var(--accent);font-weight:800;padding:0 2px;font-size:.9rem}
  .muted{color:var(--muted)} .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;opacity:0;transition:.25s;font-size:.85rem}
  .toast.show{opacity:1}
  .load{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <span style="font-size:1.4rem">🗂️</span>
  <div><h1>Secciones y categorías</h1><div class="sub">Panel admin · Canary Modas</div></div>
</header>
<div class="wrap">
  <div class="bar">
    <button id="add">＋ Nueva sección</button>
    <button class="ghost" id="reload">↻ Recargar</button>
    <span class="muted" style="align-self:center;font-size:.8rem">Los cambios se guardan al instante en tu catálogo (sin publicar).</span>
  </div>
  <div id="list"><div class="load">Cargando…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = "/.netlify/functions/jerarquia"; // ajusta si usas /api/jerarquia
const $ = s => document.querySelector(s);
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }

async function call(action, extra={}){
  const r = await fetch(API, { method:"POST", credentials:"include",
    headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ action, ...extra }) });
  const j = await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status===409 && j.articulos!=null){
      if(confirm(`Tiene ${j.articulos} artículos. ¿Borrar igualmente? (los artículos quedarán sin sección/categoría)`))
        return call(action, {...extra, forzar:true});
      throw new Error("cancelado");
    }
    throw new Error(j.error || j.message || ("Error "+r.status));
  }
  return j;
}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(jer){
  const list = $("#list");
  if(!jer || !jer.length){ list.innerHTML='<div class="load">Sin secciones.</div>'; return; }
  list.innerHTML = jer.map(s=>`
    <div class="sec">
      <div class="h">
        <span style="font-size:1.2rem">${esc(s.icono||"📦")}</span>
        <span class="nm">${esc(s.nombre)}</span>
        <span class="id">#${s.id}</span>
        <span class="chip ${s.visibleCliente?'on':'off'}" data-vis="${s.id}" title="Mostrar/ocultar al cliente">
          ${s.visibleCliente?'👁️ Visible':'🚫 Oculta'}</span>
        <div class="acts">
          <button class="mini" data-acc="cat+" data-s="${s.id}">＋ categoría</button>
          <button class="mini gris" data-acc="secE" data-s="${s.id}">✏️</button>
          <button class="mini gris" data-acc="secX" data-s="${s.id}">🗑️</button>
        </div>
      </div>
      <div class="cats">
        ${(s.categorias||[]).map(c=>`
          <div class="cat">
            <div class="r">
              <span class="cn">${esc(c.nombre)}</span><span class="id">#${c.id}</span>
              <div class="acts">
                <button class="mini" data-acc="tipo+" data-s="${s.id}" data-c="${c.id}">＋ tipo</button>
                <button class="mini gris" data-acc="catE" data-s="${s.id}" data-c="${c.id}">✏️</button>
                <button class="mini gris" data-acc="catX" data-s="${s.id}" data-c="${c.id}">🗑️</button>
              </div>
            </div>
            <div class="tipos">
              ${(c.tipos||[]).map(t=>`<span class="tp">${esc(t.nombre)}
                <button data-acc="tipoE" data-s="${s.id}" data-c="${c.id}" data-t="${t.id}" title="Editar">✏️</button>
                <button data-acc="tipoX" data-s="${s.id}" data-c="${c.id}" data-t="${t.id}" title="Borrar">×</button></span>`).join("")||'<span class="muted" style="font-size:.78rem">sin tipos</span>'}
            </div>
          </div>`).join("")||'<div class="muted" style="padding:8px 0;font-size:.82rem">sin categorías</div>'}
      </div>
    </div>`).join("");
}

async function load(){ try{ const {jerarquia}=await call("list"); render(jerarquia); }catch(e){ $("#list").innerHTML='<div class="load">No se pudo cargar: '+esc(e.message)+'<br>(¿has iniciado sesión como admin?)</div>'; } }

document.addEventListener("click", async (e)=>{
  const b = e.target.closest("[data-acc],[data-vis]"); if(!b) return;
  try{
    if(b.dataset.vis){ const s=b.classList.contains("on"); const {jerarquia}=await call("setVisibilidad",{id:+b.dataset.vis, visibleCliente:!s}); render(jerarquia); toast(s?"Oculta":"Visible"); return; }
    const a=b.dataset.acc, S=+b.dataset.s, C=+b.dataset.c, T=+b.dataset.t;
    if(a==="secE"){ const nombre=prompt("Nuevo nombre de la sección:"); if(nombre){ const {jerarquia}=await call("editarSeccion",{id:S,nombre}); render(jerarquia); toast("Guardado"); } }
    if(a==="secX"){ if(confirm("¿Borrar esta sección?")){ const {jerarquia}=await call("borrarSeccion",{id:S}); render(jerarquia); toast("Borrada"); } }
    if(a==="cat+"){ const nombre=prompt("Nombre de la nueva categoría:"); if(nombre){ const {jerarquia}=await call("crearCategoria",{seccionId:S,nombre}); render(jerarquia); toast("Creada"); } }
    if(a==="catE"){ const nombre=prompt("Nuevo nombre de la categoría:"); if(nombre){ const {jerarquia}=await call("editarCategoria",{seccionId:S,id:C,nombre}); render(jerarquia); toast("Guardado"); } }
    if(a==="catX"){ if(confirm("¿Borrar esta categoría?")){ const {jerarquia}=await call("borrarCategoria",{seccionId:S,id:C}); render(jerarquia); toast("Borrada"); } }
    if(a==="tipo+"){ const nombre=prompt("Nombre del nuevo tipo:"); if(nombre){ const {jerarquia}=await call("crearTipo",{seccionId:S,categoriaId:C,nombre}); render(jerarquia); toast("Creado"); } }
    if(a==="tipoE"){ const nombre=prompt("Nuevo nombre del tipo:"); if(nombre){ const {jerarquia}=await call("editarTipo",{seccionId:S,categoriaId:C,id:T,nombre}); render(jerarquia); toast("Guardado"); } }
    if(a==="tipoX"){ if(confirm("¿Borrar este tipo?")){ const {jerarquia}=await call("borrarTipo",{seccionId:S,categoriaId:C,id:T}); render(jerarquia); toast("Borrado"); } }
  }catch(err){ if(err.message!=="cancelado") toast("⚠️ "+err.message); }
});
$("#add").addEventListener("click", async ()=>{ const nombre=prompt("Nombre de la nueva sección:"); if(nombre){ try{ const {jerarquia}=await call("crearSeccion",{nombre,visibleCliente:false}); render(jerarquia); toast("Sección creada"); }catch(e){ toast("⚠️ "+e.message); } } });
$("#reload").addEventListener("click", load);
load();
</script>
</body>
</html>
