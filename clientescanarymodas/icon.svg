<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Canary Modas B2B">
  <defs>
    <!-- Fondo burdeos degradado de la marca -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9c2614"/>
      <stop offset="100%" stop-color="#4a1208"/>
    </linearGradient>
    <!-- Parche naranja del logo "canary modas" -->
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7a04a"/>
      <stop offset="100%" stop-color="#f08020"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado (compatible PWA "maskable": 40% interior es zona segura) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Parche naranja girado, esquina superior derecha (estilo del logo) -->
  <g transform="translate(380 110) rotate(-12)">
    <polygon points="-60,-50 60,-44 70,38 -56,52 -50,18 -64,-10"
             fill="url(#acc)" stroke="#6b3306" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- "canary modas" en blanco arriba -->
  <text x="256" y="200" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif"
        font-size="56" font-weight="600" font-style="italic"
        fill="#ffffff" letter-spacing="-1.5"
        style="text-shadow: 0 2px 6px rgba(0,0,0,.25)">canary modas</text>

  <!-- "B2B" GRANDE en blanco, centrado -->
  <text x="256" y="395" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif"
        font-size="200" font-weight="900"
        fill="#ffffff" letter-spacing="-6"
        style="text-shadow: 0 4px 10px rgba(0,0,0,.35)">B2B</text>

  <!-- Pequeña línea decorativa naranja debajo -->
  <rect x="186" y="425" width="140" height="6" rx="3" fill="url(#acc)"/>
</svg>
